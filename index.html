const S={}; SERIES.forEach(x=>S[x.id]=x); const P={}; PRODUCTS.forEach(x=>P[x.name]=x);
function top(){window.scrollTo({top:0,behavior:'smooth'})}
function home(){closeMenu();app.innerHTML=`<section class="hero"><div class="wrap"><div class="heroIn"><div class="eyebrow">JUMINGXUAN TEA</div><h1>一杯好茶 · 连接世界</h1><div class="heroEn">A FINE CUP OF TEA BRINGS THE WORLD CLOSER</div><div class="heroSub">源于自然 · 致敬传统 · 品味生活</div><div class="heroSubEn">From Nature · In Heritage · For a Better Life</div><button class="btn" onclick="goSeries('green')">探索我们的茶叶 →</button></div></div></section><section class="section"><div class="wrap"><div class="sectionHead"><div><div class="kicker">OUR TEA SERIES</div><h2>产品系列</h2><div class="sub">七大茶类 · 品味中国 · 连接世界</div></div></div><div class="seriesGrid">${SERIES.map(seriesCard).join('')}</div></div></section>`;top()}
function seriesCard(s){let p=P[s.products[0]];return `<article class="seriesCard" onclick="goSeries('${s.id}')"><img src="${p.img}" alt="${s.cn}"><div class="cardBody"><div class="cardTitle">${s.cn}</div><div class="cardEn">${s.en}</div><div class="cardTag">${s.tag}</div><div class="arrow">查看系列 → &nbsp; <span style="font-weight:400">${s.tagEn}</span></div></div></article>`}
function goSeries(id){closeMenu();let s=S[id];app.innerHTML=`<section class="seriesPage"><div class="wrap"><div class="crumb" onclick="home()">← 返回首页</div><div class="seriesHero"><img src="${P[s.products[0]].img}" alt="${s.cn}"><div class="seriesHeroText"><h2>${s.cn}</h2><p>${s.en} · ${s.tag}</p></div></div><div class="sectionHead"><div><div class="kicker">${s.en.toUpperCase()}</div><h2>${s.cn}</h2><div class="sub">${s.tag} · ${s.tagEn}</div></div></div><div class="productGrid">${s.products.map(n=>productCard(P[n])).join('')}</div></div></section>`;top()}
function productCard(p){return `<article class="productCard" onclick="detail('${p.name}')"><img src="${p.img}" alt="${p.name}"><div class="cardBody"><div class="productTitle">${p.name}</div><div class="cardEn">${p.en}</div><div class="cardTag">${p.flavor}</div><div class="arrow">了解详情 →</div></div></article>`}
function detail(name){closeMenu();let p=P[name], s=S[p.series];app.innerHTML=`<section class="detail"><div class="wrap"><div class="back" onclick="goSeries('${p.series}')">← 返回${s.cn}</div><div class="detailGrid"><div class="detailImage"><img src="${p.img}" alt="${p.name}"></div><div class="detailInfo"><div class="kicker">${s.en.toUpperCase()}</div><h1>${p.name}</h1><div class="detailEn">${p.en}</div><div class="infoGrid"><div class="infoBox"><div class="label">产地 / ORIGIN</div><div class="value">${p.origin}</div></div><div class="infoBox"><div class="label">等级 / GRADE</div><div class="value">${p.grade}</div></div><div class="infoBox"><div class="label">系列 / SERIES</div><div class="value">${s.cn}</div></div><div class="infoBox"><div class="label">FLAVOR PROFILE</div><div class="value">${p.eng_flavor}</div></div></div><div class="copy"><h3>产品介绍 / Introduction</h3><p>${p.flavor} ${p.name} 以其地域风土与传统工艺形成鲜明风格，适合细细品饮，在香气、滋味与回甘之间展现自然层次。</p><p>${p.eng_flavor} ${p.en} reflects its terroir and traditional craftsmanship, offering a balanced expression of aroma, texture and lingering sweetness.</p></div><div class="guide"><strong>冲泡方法 / Brewing Guide</strong><br>${p.guide}</div></div></div></div></section>`;top()}
function showSeriesMenu(){let m=document.getElementById('mobileMenu');m.innerHTML=SERIES.map(s=>`<a href="#" onclick="goSeries('${s.id}');return false"><b>${s.cn}</b><br><small>${s.en}</small></a>`).join('');m.style.display='block'}
function toggleMenu(){let m=document.getElementById('mobileMenu');if(m.style.display==='block'){closeMenu()}else{showSeriesMenu()}}
function closeMenu(){document.getElementById('mobileMenu').style.display='none'}
function about(){closeMenu();app.innerHTML=`<section class="section"><div class="wrap"><div class="kicker">ABOUT US</div><h2>关于聚茗轩</h2><p style="max-width:850px;line-height:2">一杯茶，不只是风味，也是一种人与自然、传统与生活之间的连接。聚茗轩茶业以中国茶文化为基础，精选不同地域与工艺的茶品，希望让更多人通过一杯好茶，感受中国茶的香气、温度与从容。</p><p style="max-width:850px;line-height:2">Tea is more than flavor—it connects nature, heritage and everyday life. JUMINGXUAN TEA presents a curated selection of Chinese teas and tea ware for tea lovers around the world.</p></div></section>`;top()}
